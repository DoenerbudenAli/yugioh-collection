# Projektspezifische Werte des Harness. Der Harness-Code selbst bleibt projektneutral
# und liest alles Projektbezogene aus dieser Datei. Hier stehen keine Geheimnisse.

# GitHub App der Agenten (ADR 0005, „Rollen“). Der Private Key liegt offline beim Owner
# und später nur im Broker.
[github_app]
slug = "kaiba-agent"
app_id = 5202274
installation_id = 168276221
# Für die noreply-Adresse der Bot-Commits: <bot_user_id>+<slug>[bot]@users.noreply.github.com
bot_user_id = 338301849

# Broker für Rollen-Tokens (ADR 0005, „Broker“, „Rollen“, „Rollenbindung“). Er hört nur auf 127.0.0.1,
# Container erreichen ihn über host.docker.internal. Metadata (lesen) gibt GitHub jedem Token dazu.
[broker]
repository = "yugioh-collection"
port = 8790

[broker.rollen.planung]
issues = "write"
contents = "read"

[broker.rollen.bau]
contents = "write"
pull_requests = "write"
issues = "read"

# Devcontainer der Agenten (ADR 0005, „Grenze“). Das Image heißt ghcr.io/<repository klein>/devcontainer.
[devcontainer]
repository = "DoenerbudenAli/yugioh-collection"

# Netz-Allowlist im Container (ADR 0005, „Netz“). GitHub-Bereiche kommen aus api.github.com/meta,
# der Broker ist immer erlaubt. Neue Domains kommen per PR.
[netz]
github_meta = ["web", "api", "git"]
domains = ["api.anthropic.com", "pypi.org", "files.pythonhosted.org", "registry.npmjs.org"]
